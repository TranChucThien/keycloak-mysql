# Docker Compose for Keycloak + MySQL with Local Mount Deployment
# Purpose: Traditional approach using local volume mount for custom mappers
# Usage: Build JAR locally and mount ./deployments folder to Keycloak
# Commands: 
#   docker-compose --profile build run --rm build-mapper
#   docker-compose up -d

services:
  mysql:
    image: mysql:8.0.23
    container_name: keycloak-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: supersecretpassword
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak_user
      MYSQL_PASSWORD: keycloak_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - keycloak-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Service to build the custom token mapper JAR
  build-mapper:
    build:
      context: ./aje-keycloak-token-mapper-k8s-prod
      dockerfile: Dockerfile
      target: builder
    volumes:
      - ./deployments:/output
    command: sh -c "cp /app/target/*.jar /output/ && echo 'JAR copied to deployments/'"
    profiles:
      - build

  keycloak:
    image: quay.io/keycloak/keycloak:12.0.4
    container_name: keycloak
    restart: always
    environment:
      DB_VENDOR: MYSQL
      DB_ADDR: mysql
      DB_DATABASE: keycloak
      DB_USER: keycloak_user
      DB_PASSWORD: keycloak_password
      JDBC_PARAMS: "connectTimeout=30000"
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: admin_password
    volumes:
      - ./deployments:/opt/jboss/keycloak/standalone/deployments
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - keycloak-net

volumes:
  mysql_data:
    driver: local

networks:
  keycloak-net:
    driver: bridge
