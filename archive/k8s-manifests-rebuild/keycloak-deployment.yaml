# Keycloak Deployment with Init Container for Custom Mappers
# Purpose: Modern K8s deployment using init container to copy mappers from registry
# Usage: kubectl apply -f k8s-manifests-init-container/
# Note: Requires chucthien03/custom-mapper-registry image and external MySQL

apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image:  chucthien03/keycloak:16
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: keycloak-config
        - secretRef:
            name: keycloak-secret

---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector:
    app: keycloak
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
  type: NodePort