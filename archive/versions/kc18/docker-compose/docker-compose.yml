version: '3.8'

services:
  mysql:
    image: mysql:8.0.23
    container_name: keycloak-mysql-18
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak_user
      MYSQL_PASSWORD: keycloak_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data_18:/var/lib/mysql
    networks:
      - keycloak_network_18
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: chucthien03/keycloak:18
    container_name: keycloak-18
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_password
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloak
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
    ports:
      - "8081:8080"
    networks:
      - keycloak_network_18
    command: start-dev

volumes:
  mysql_data_18:

networks:
  keycloak_network_18:
    driver: bridge
