# Docker Compose for Keycloak + MySQL with Init Container Deployment
# Purpose: Modern approach using init container to copy mappers from registry image
# Usage: Simulates K8s init container pattern in Docker Compose
# Commands: docker-compose up -d
# Note: Requires chucthien03/custom-mapper-registry image to be available

services:
  mysql:
    image: mysql:8.0.23
    container_name: keycloak-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: supersecretpassword
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak_user
      MYSQL_PASSWORD: keycloak_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - keycloak-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Init container to copy mappers from registry image
  mapper-init:
    image: chucthien03/custom-mapper-registry
    container_name: mapper-init
    command: sh -c "cp /opt/mappers/*.jar /shared-mappers/ && echo 'Mappers copied successfully'"
    volumes:
      - shared_mappers:/shared-mappers
    networks:
      - keycloak-net

  keycloak:
    image: quay.io/keycloak/keycloak:12.0.4
    container_name: keycloak
    restart: always
    environment:
      DB_VENDOR: MYSQL
      DB_ADDR: mysql
      DB_DATABASE: keycloak
      DB_USER: keycloak_user
      DB_PASSWORD: keycloak_password
      JDBC_PARAMS: "connectTimeout=30000"
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: admin_password
    volumes:
      - shared_mappers:/opt/jboss/keycloak/standalone/deployments
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      mapper-init:
        condition: service_completed_successfully
    networks:
      - keycloak-net

volumes:
  mysql_data:
    driver: local
  shared_mappers:
    driver: local

networks:
  keycloak-net:
    driver: bridge