# Docker Compose for Keycloak 21 with Built-in Custom Mappers
# Purpose: Run Keycloak with custom token mappers built into the image
# Image: chucthien03/keycloak:21-prod (built from Dockerfile.builtin)
# Approach: JAR files in /opt/keycloak/providers/
# Usage: docker-compose up -d
# Access: http://localhost:8080 (admin/admin_password)

version: '3.8'

services:
  keycloak-mysql:
    image: mysql:8.0.23
    container_name: keycloak-mysql
    environment:
      MYSQL_ROOT_PASSWORD: supersecretpassword
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak_user
      MYSQL_PASSWORD: keycloak_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - keycloak-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  keycloak:

    image: chucthien03/keycloak:21.1.2
    container_name: keycloak-kc21
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://keycloak-mysql:3306/keycloak
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_password
    command:
      - start
    ports:
      - "8080:8080"
    depends_on:
      keycloak-mysql:
        condition: service_healthy
    networks:
      - keycloak-net

volumes:
  mysql_data:

networks:
  keycloak-net:
    driver: bridge